name: Generate Android Upload Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate upload keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"

          keytool -genkeypair -v \
            -keystore upload-keystore.jks \
            -storetype JKS \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=RizzGuru, OU=Mobile, O=RizzGuru, L=Unknown, ST=Unknown, C=IN"

          keytool -list \
            -keystore upload-keystore.jks \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD"

          base64 -w 0 upload-keystore.jks > upload-keystore.base64

      - name: Upload encoded keystore
        uses: actions/upload-artifact@v4
        with:
          name: android-upload-keystore-base64
          path: upload-keystore.base64
          retention-days: 1
