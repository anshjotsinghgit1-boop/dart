name: Test Functions Logic

on:
  pull_request:
    paths:
      - "functions/**"
      - ".github/workflows/test-functions.yml"
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - ".github/workflows/test-functions.yml"

permissions:
  contents: read

jobs:
  test-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check functions/index.js
          node --check functions/ai_clients.js
          node --check functions/ai_reply_tiers.js
          node --check functions/reply_prompt.js

      - name: Run unit tests
        run: node --test functions/*.test.js
