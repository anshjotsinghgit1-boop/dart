name: Deploy Firestore

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "firebase.json"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "firestore.databaseforrizzaj.indexes.json"
      - ".firebaserc"
      - ".github/workflows/deploy-firestore.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.32.1

      - name: Deploy Firestore rules and indexes
        run: firebase deploy --only firestore --project replyai-749f7
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-service-account.json

      - name: Create Firebase service account key
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > firebase-service-account.json

      - name: Deploy Firestore rules and indexes
        run: firebase deploy --only firestore --project replyai-749f7
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-service-account.json

      - name: Remove service account key
        if: always()
        run: rm -f firebase-service-account.json
