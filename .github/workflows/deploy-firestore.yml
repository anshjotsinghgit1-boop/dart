name: Deploy Firestore

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "firebase.json"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "firestore.databaseforrizzaj.indexes.json"
      - ".firebaserc"
      - ".github/workflows/deploy-firestore.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: functions
        run: npm install

      - name: Deploy Firestore
        uses: w9jds/firebase-action@v15.28.1
        with:
          args: deploy --only firestore
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: replyai-749f7
