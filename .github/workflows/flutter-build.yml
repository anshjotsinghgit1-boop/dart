name: Build Flutter Android APK + AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Verify google-services.json
        run: |
          echo "=== Package names in google-services.json ==="
          grep "package_name" android/app/google-services.json
          echo "=== App IDs in google-services.json ==="
          grep "mobilesdk_app_id" android/app/google-services.json

      - name: Set up keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "✅ Restored keystore from secret — SHA-1 will be consistent"
          else
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            echo ""
            echo "⚠️  KEYSTORE_BASE64 secret not set yet."
            echo "👇  Copy ALL the base64 text below and save it as a GitHub Secret named KEYSTORE_BASE64"
            echo "====BASE64 START===="
            base64 ~/.android/debug.keystore
            echo "====BASE64 END===="
          fi

      - name: Print SHA-1 of keystore
        run: |
          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android | grep SHA1

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate app icons
        run: flutter pub run flutter_launcher_icons

      - name: Build APK (for testing on phone)
        run: flutter build apk --release --dart-define=AICREDITS_API_KEY=${{ secrets.AICREDITS_API_KEY }}

      - name: Build AAB (for Play Store)
        run: flutter build appbundle --release --dart-define=AICREDITS_API_KEY=${{ secrets.AICREDITS_API_KEY }}

      - name: Confirm outputs exist
        run: |
          echo "=== APK ==="
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          echo "=== AAB ==="
          ls -lh build/app/outputs/bundle/release/app-release.aab
          echo "=== SHA-1 from keystore ==="
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android 2>/dev/null | grep "SHA1:"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
