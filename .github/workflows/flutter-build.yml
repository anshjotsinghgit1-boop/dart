name: Build Flutter Android APK + AAB

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail

          test -n "$GOOGLE_SERVICES_JSON"

          printf '%s' "$GOOGLE_SERVICES_JSON" \
            > android/app/google-services.json

      - name: Verify google-services.json
        run: |
          set -euo pipefail

          test -s android/app/google-services.json

          echo "=== Package names ==="
          grep "package_name" android/app/google-services.json

          echo "=== Firebase app IDs ==="
          grep "mobilesdk_app_id" android/app/google-services.json

      - name: Restore release upload keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$UPLOAD_KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          printf '%s' "$UPLOAD_KEYSTORE_BASE64" \
            | base64 --decode > android/app/upload-keystore.jks

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          chmod 600 \
            android/key.properties \
            android/app/upload-keystore.jks

      - name: Verify release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          keytool -list \
            -keystore android/app/upload-keystore.jks \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            > /dev/null

          echo "Release upload keystore loaded successfully."

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate app icons
        run: flutter pub run flutter_launcher_icons

      - name: Build release APK
        env:
          AICREDITS_API_KEY: ${{ secrets.AICREDITS_API_KEY }}
        run: |
          set -euo pipefail

          test -n "$AICREDITS_API_KEY"

          flutter build apk \
            --release \
            --dart-define="AICREDITS_API_KEY=$AICREDITS_API_KEY"

      - name: Build release AAB
        env:
          AICREDITS_API_KEY: ${{ secrets.AICREDITS_API_KEY }}
        run: |
          set -euo pipefail

          test -n "$AICREDITS_API_KEY"

          flutter build appbundle \
            --release \
            --dart-define="AICREDITS_API_KEY=$AICREDITS_API_KEY"

      - name: Confirm release files exist
        run: |
          set -euo pipefail

          test -s build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/bundle/release/app-release.aab

          echo "Release APK created:"
          ls -lh build/app/outputs/flutter-apk/app-release.apk

          echo "Release AAB created:"
          ls -lh build/app/outputs/bundle/release/app-release.aab

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing files
        if: always()
        run: |
          rm -f android/key.properties
          rm -f android/app/upload-keystore.jks
